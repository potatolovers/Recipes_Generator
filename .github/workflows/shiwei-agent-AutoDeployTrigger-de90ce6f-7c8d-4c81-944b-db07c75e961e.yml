name: Trigger auto deployment for shiwei-agent

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ agent-dev ]
    paths:
    - 'agent/**'
    - '.github/workflows/shiwei-agent-AutoDeployTrigger-de90ce6f-7c8d-4c81-944b-db07c75e961e.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SHIWEIAGENT_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SHIWEIAGENT_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SHIWEIAGENT_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/agent
          _dockerfilePathKey_: Dockerfile
          targetPort: 8000
          registryUrl: shiweiimage.azurecr.io
          registryUsername: ${{ secrets.SHIWEIAGENT_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.SHIWEIAGENT_REGISTRY_PASSWORD }}
          containerAppName: shiwei-agent
          resourceGroup: rg-mugglechen98-1429
          imageToBuild: shiweiimage.azurecr.io/shiwei-agent:${{ github.sha }}


